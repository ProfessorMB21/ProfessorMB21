<svg viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyber-grad-dark-original" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.12" />
      <stop offset="50%" style="stop-color:#0D9488;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:0.12" />
    </linearGradient>
    <linearGradient id="accent-dark-original" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981" />
      <stop offset="50%" style="stop-color:#0D9488" />
      <stop offset="100%" style="stop-color:#34D399" />
    </linearGradient>
    <filter id="cyber-glow-dark-original">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep dark background -->
  <rect width="1200" height="450" fill="#0F172A"/>
  <rect width="1200" height="450" fill="url(#cyber-grad-dark-original)"/>

  <!-- Cyberpunk glitch frame - top left -->
  <g opacity="0.8">
    <rect x="40" y="30" width="140" height="140" fill="none" stroke="#10B981" stroke-width="3"/>
    <rect x="50" y="40" width="120" height="120" fill="none" stroke="#0D9488" stroke-width="1.5" opacity="0.7"/>
    <line x1="40" y1="50" x2="180" y2="50" stroke="#10B981" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="160" x2="180" y2="160" stroke="#10B981" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Cyberpunk glitch frame - top right -->
  <g opacity="0.8">
    <rect x="1020" y="30" width="140" height="140" fill="none" stroke="#0D9488" stroke-width="3"/>
    <rect x="1010" y="40" width="120" height="120" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.7"/>
    <line x1="1020" y1="50" x2="1160" y2="50" stroke="#0D9488" stroke-width="2" opacity="0.6"/>
    <line x1="1020" y1="160" x2="1160" y2="160" stroke="#0D9488" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Main heading with glow -->
  <text x="600" y="100" font-family="'Courier New', monospace" font-size="68" font-weight="900" text-anchor="middle" fill="#10B981" letter-spacing="3" filter="url(#cyber-glow-dark-original)">
    &gt; BUPE MWANSA &lt;
  </text>

  <!-- Glitch lines -->
  <line x1="250" y1="88" x2="350" y2="88" stroke="#10B981" stroke-width="3" opacity="0.8"/>
  <line x1="850" y1="112" x2="950" y2="112" stroke="#34D399" stroke-width="3" opacity="0.8"/>

  <!-- Subtitle -->
  <text x="600" y="180" font-family="'Courier New', monospace" font-size="28" font-weight="700" text-anchor="middle" fill="#34D399" letter-spacing="2">
    // MATH + CS UNDERGRAD //
  </text>

  <!-- Decorative lines -->
  <line x1="300" y1="175" x2="450" y2="175" stroke="#0D9488" stroke-width="2" opacity="0.7"/>
  <line x1="750" y1="175" x2="900" y2="175" stroke="#0D9488" stroke-width="2" opacity="0.7"/>

  <!-- Description -->
  <text x="600" y="235" font-family="'Courier New', monospace" font-size="15" text-anchor="middle" fill="#cbd5e1" opacity="0.95">
    [ ALX_AFRICA COHORT_17 ] :: [ SOFTWARE_ENGINEERING ] :: [ SELF-TAUGHT ]
  </text>

  <!-- Tech stack info -->
  <text x="600" y="290" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" fill="#10B981" opacity="0.9">
    @SPECIALTIES: Data_Science | Python | C | JavaScript | Backend | Algorithms
  </text>

  <!-- Status indicator with glow -->
  <g>
    <circle cx="580" cy="340" r="6" fill="#34D399" filter="url(#cyber-glow-dark-original)"/>
    <text x="600" y="348" font-family="'Courier New', monospace" font-size="14" fill="#34D399">ONLINE • ACCEPTING_COLLABS</text>
  </g>

  <!-- Bottom decorative elements -->
  <line x1="200" y1="390" x2="1000" y2="390" stroke="#10B981" stroke-width="1" opacity="0.5" stroke-dasharray="5,5"/>

  <!-- Corner brackets -->
  <g opacity="0.7">
    <polyline points="150,400 100,400 100,450" fill="none" stroke="#0D9488" stroke-width="2"/>
    <polyline points="1050,400 1100,400 1100,450" fill="none" stroke="#34D399" stroke-width="2"/>
  </g>

  <!-- Accent line with glow -->
  <rect x="300" y="415" width="600" height="3" fill="url(#accent-dark-original)" rx="1.5" filter="url(#cyber-glow-dark-original)"/>
</svg>
